<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiên cứu xác suất xúc xắc</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #2b1d12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #e6c88b;
            overflow-x: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: 15px;
        }

        .bowl {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #c99b58 0%, #5c3a1e 80%, #2b1d12 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #b8864b;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .dice-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 80%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .dice-area.show { opacity: 1; }

        .lid {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #f5d796 0%, #b8864b 60%, #5c3a1e 100%);
            box-shadow: 0 8px 15px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.5);
            border: 4px solid #d4af37;
            z-index: 10;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            touch-action: none;
            transition: transform 0.3s ease-out, opacity 0.3s; 
        }

        .lid:active { cursor: grabbing; }

        .lid.closed { 
            transform: translate(0, 0) scale(1); 
            opacity: 1; 
            pointer-events: auto;
        }
        
        .lid.open { 
            transform: translate(0, -300px) scale(0.5); 
            opacity: 0; 
            pointer-events: none;
        }

        .lid-text {
            color: #5c3a1e;
            font-weight: bold;
            font-size: 11px;
            margin-top: 5px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .dice {
            width: 45px;
            height: 45px;
            background-color: #e01a1a;
            border-radius: 8px;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 4px;
            box-sizing: border-box;
        }

        .dot {
            background-color: white;
            border-radius: 50%;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            margin: auto;
            width: 8px;
            height: 8px;
        }

        .dot-1 { grid-area: 2 / 2; }
        .dot-2 { grid-area: 1 / 1; }
        .dot-3 { grid-area: 1 / 3; }
        .dot-4 { grid-area: 3 / 1; }
        .dot-5 { grid-area: 3 / 3; }
        .dot-6 { grid-area: 2 / 1; }
        .dot-7 { grid-area: 2 / 3; }

        button {
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            color: #2b1d12;
            background: linear-gradient(to bottom, #fceabb, #d4af37);
            border: 2px solid #b8864b;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
            margin-bottom: 20px;
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .chart-container {
            width: 95vw;
            max-width: 800px;
            display: flex;
            justify-content: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        canvas {
            background-color: #1a100c;
            border: 2px solid #4a3525;
            border-radius: 8px;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* Giao diện Máy Điều Khiển */
        #control-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #5c3a1e;
            margin-top: 20px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .btn-grid button {
            padding: 15px 0;
            margin-bottom: 0;
            border-radius: 10px;
            font-size: 16px;
        }
        .btn-tai { background: linear-gradient(to bottom, #ff9999, #cc0000); color: white; border-color: #cc0000; }
        .btn-xiu { background: linear-gradient(to bottom, #ffffff, #cccccc); color: black; border-color: #999; }
        .btn-reset { background: linear-gradient(to bottom, #666666, #333333); color: white; border-color: #222; }
        
        #room-code {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 14px;
            color: #a07a4a;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #5c3a1e;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="room-code">Mã kết nối: Đang tạo...</div>

    <!-- GIAO DIỆN MÁY CHƠI -->
    <div id="player-ui" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div class="game-container">
            <div class="bowl">
                <div class="dice-area" id="dice-area"></div>
            </div>
            <div class="lid closed" id="lid">
                <div style="font-size: 35px; color: #b8864b; pointer-events: none;">🎲</div>
                <div class="lid-text" id="lid-text">Kéo Ra Khỏi Đĩa Để Mở</div>
            </div>
        </div>

        <button id="roll-btn">Phiên Mới</button>

        <div class="chart-container">
            <canvas id="myChart" width="700" height="200"></canvas>
        </div>
    </div>

    <!-- GIAO DIỆN MÁY ĐIỀU KHIỂN -->
    <div id="control-panel">
        <h2 style="margin-top: 0; color: #d4af37;">Bảng Điều Khiển Từ Xa</h2>
        <h3 id="control-status" style="color: #ffaa00;">Đang kết nối...</h3>
        
        <button onclick="sendRoll()" style="width: 100%; padding: 15px; font-size: 18px; margin-bottom: 20px;">LẮC (Phiên Mới)</button>
        
        <p style="margin: 0;">Chọn ép Tài / Xỉu cho phiên tiếp theo:</p>
        <div class="btn-grid" style="grid-template-columns: 1fr 1fr;">
            <button class="btn-tai" onclick="sendForce('tai')">Ép Tài (11-18)</button>
            <button class="btn-xiu" onclick="sendForce('xiu')">Ép Xỉu (3-10)</button>
        </div>

        <p style="margin-top: 20px; margin-bottom: 0;">Hoặc ép chính xác Tổng Điểm:</p>
        <div class="btn-grid" id="exact-score-grid">
            <!-- Tự động tạo nút từ 3 đến 18 -->
        </div>

        <button class="btn-reset" onclick="sendForce('none')" style="width: 100%; margin-top: 20px;">HỦY ÉP (Trở lại ngẫu nhiên)</button>
    </div>

    <script>
        const diceArea = document.getElementById('dice-area');
        const lid = document.getElementById('lid');
        const lidText = document.getElementById('lid-text');
        const rollBtn = document.getElementById('roll-btn');
        const canvas = document.getElementById('myChart');
        const ctx = canvas.getContext('2d');
        const roomCodeEl = document.getElementById('room-code');

        let isRolling = false;
        let currentDice = []; 
        let allHistory = []; 
        const MAX_CHART_HISTORY = 23;
        
        // Biến lưu lệnh ép từ Máy 2
        let remoteForcedValue = null; 

        // --- URL PARAMS (Dành cho test) ---
        const urlParams = new URLSearchParams(window.location.search);
        const controlRoom = urlParams.get('control');
        
        let peer = null;
        let conn = null;

        // --- KHỞI TẠO KẾT NỐI P2P ---
        if (controlRoom) {
            // MÁY ĐIỀU KHIỂN (MÁY 2)
            document.getElementById('player-ui').style.display = 'none';
            document.getElementById('control-panel').style.display = 'flex';
            roomCodeEl.style.display = 'none';

            const grid = document.getElementById('exact-score-grid');
            for (let i = 3; i <= 18; i++) {
                let btn = document.createElement('button');
                btn.innerText = `Ép ${i}`;
                btn.onclick = () => sendForce(i);
                grid.appendChild(btn);
            }

            peer = new Peer(); 
            peer.on('open', () => {
                conn = peer.connect('xucxac-room-' + controlRoom);
                conn.on('open', () => {
                    document.getElementById('control-status').innerText = "Đã kết nối! (Đang chờ Máy 1)";
                    document.getElementById('control-status').style.color = "#00ff00";
                });
                conn.on('data', (data) => {
                    if (data.type === 'status') {
                        if (data.isOpen) {
                            document.getElementById('control-status').innerText = "LỖI: Máy 1 đang mở nắp!";
                            document.getElementById('control-status').style.color = "#ff0000";
                        } else if (data.isRolling) {
                            document.getElementById('control-status').innerText = "Máy 1 đang xử lý...";
                            document.getElementById('control-status').style.color = "#ffaa00";
                        } else {
                            document.getElementById('control-status').innerText = "Đã kết nối (Sẵn sàng)";
                            document.getElementById('control-status').style.color = "#00ff00";
                        }
                    }
                });
            });

            window.sendForce = function(val) {
                if (conn) conn.send({ type: 'force', value: val });
            };
            window.sendRoll = function() {
                if (conn) conn.send({ type: 'roll' });
            };

        } else {
            // MÁY CHƠI (MÁY 1)
            const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            roomCodeEl.innerText = `Mã kết nối: ${roomCode}`;

            peer = new Peer('xucxac-room-' + roomCode);
            
            peer.on('open', () => { console.log('Đang đợi kết nối:', roomCode); });

            peer.on('connection', (connection) => {
                conn = connection;
                roomCodeEl.innerText = `Đã kết nối (Mã: ${roomCode})`;
                roomCodeEl.style.color = '#00ff00';
                
                conn.on('data', (data) => {
                    if (data.type === 'force') {
                        // Kiểm tra xem nắp có đang mở hoặc đang xử lý không
                        if (!lid.classList.contains('closed') || isRolling) {
                            conn.send({ type: 'status', isOpen: !lid.classList.contains('closed'), isRolling: isRolling });
                            return; 
                        }
                        
                        remoteForcedValue = data.value;
                        if (remoteForcedValue === 'tai') currentDice = generateDiceInRange(11, 18);
                        else if (remoteForcedValue === 'xiu') currentDice = generateDiceInRange(3, 10);
                        else if (remoteForcedValue !== 'none') currentDice = generateDiceInRange(remoteForcedValue, remoteForcedValue);
                        
                        conn.send({ type: 'status', isOpen: false, isRolling: false });
                        
                    } else if (data.type === 'roll') {
                        if (!isRolling) startNewRound(); 
                    }
                });
            });
        }

        // --- CÁC HÀM XỬ LÝ XÚC XẮC ---
        function getCryptoRandomInt(min, max) {
            const range = max - min + 1;
            const maxValid = Math.floor(256 / range) * range;
            const array = new Uint8Array(1);
            let value;
            do {
                window.crypto.getRandomValues(array);
                value = array[0];
            } while (value >= maxValid);
            return min + (value % range);
        }

        function getRandomDiceValue() { return getCryptoRandomInt(1, 6); }

        function createDiceElement(value) {
            const dice = document.createElement('div');
            dice.className = 'dice';
            const dotPositions = {
                1: ['dot-1'], 2: ['dot-2', 'dot-5'], 3: ['dot-2', 'dot-1', 'dot-5'],
                4: ['dot-2', 'dot-3', 'dot-4', 'dot-5'], 5: ['dot-2', 'dot-3', 'dot-4', 'dot-5', 'dot-1'],
                6: ['dot-2', 'dot-3', 'dot-4', 'dot-5', 'dot-6', 'dot-7']
            };
            dotPositions[value].forEach(pos => {
                const dot = document.createElement('div');
                dot.className = `dot ${pos}`;
                dice.appendChild(dot);
            });
            return dice;
        }

        function generateDiceInRange(minTotal, maxTotal) {
            let d1, d2, d3, total;
            do {
                d1 = getRandomDiceValue(); d2 = getRandomDiceValue(); d3 = getRandomDiceValue();
                total = d1 + d2 + d3;
            } while (total < minTotal || total > maxTotal);
            return [d1, d2, d3];
        }

        function renderDiceFromArray(diceArray) {
            diceArea.innerHTML = '';
            diceArray.forEach(val => { diceArea.appendChild(createDiceElement(val)); });
            diceArea.classList.add('show');
        }

        // --- BIỂU ĐỒ (ĐÃ THÊM PADDING CHỐNG CẮT VIỀN) ---
        function updateHistory(totalScore) {
            allHistory.push(totalScore);
            if (allHistory.length > MAX_CHART_HISTORY) allHistory.shift(); 
            drawChart();
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const rows = 15; 
            const cols = MAX_CHART_HISTORY - 1;
            
            // Thêm khoảng đệm (padding) để các điểm tròn không bị cắt xén ở viền
            const padding = 20; 
            const drawWidth = canvas.width - padding * 2;
            const drawHeight = canvas.height - padding * 2;

            // Vẽ lưới nền
            ctx.strokeStyle = '#3a2b20'; 
            ctx.lineWidth = 1;
            for(let i=0; i<=rows; i++) { 
                let y = padding + i * (drawHeight / rows); 
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); 
            }
            for(let i=0; i<=cols; i++) { 
                let x = padding + i * (drawWidth / cols); 
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); 
            }
            
            const data = allHistory;
            if (data.length === 0) return;
            
            // Tính toán tọa độ các điểm dựa trên padding
            const points = data.map((score, index) => {
                const x = padding + index * (drawWidth / cols);
                const y = padding + drawHeight - ((score - 3) / 15) * drawHeight;
                return { x, y, score };
            });
            
            // Vẽ đường nối
            ctx.beginPath(); 
            ctx.strokeStyle = '#e6c88b'; 
            ctx.lineWidth = 3;
            points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
            
            // Vẽ các điểm tròn
            points.forEach(p => {
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); // Giảm nhẹ bán kính xuống 12 để vừa vặn hơn
                if (p.score >= 11) {
                    ctx.fillStyle = '#111'; ctx.fill(); ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#fff';
                } else {
                    ctx.fillStyle = '#f5d796'; ctx.fill(); ctx.strokeStyle = '#8b6508'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#000';
                }
                ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.score, p.x, p.y + 1);
            });
        }

        // --- THUẬT TOÁN 30 PHIÊN ---
        let sessionPool = [];
        function initSessionPool() {
            sessionPool = Array(23).fill('normal').concat(Array(7).fill('bias'));
            for (let i = sessionPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sessionPool[i], sessionPool[j]] = [sessionPool[j], sessionPool[i]];
            }
        }
        initSessionPool();

        // --- LUỒNG GAME CHÍNH (ĐÃ XÓA HIỆU ỨNG XỐC) ---
        function startNewRound() {
            if (isRolling) return;
            
            // Đảm bảo nắp đóng và reset trạng thái
            lid.classList.remove('open');
            lid.classList.add('closed');
            lid.style.transition = '';
            lid.style.transform = '';
            lid.style.opacity = '';
            diceArea.classList.remove('show');

            rollBtn.disabled = true;
            isRolling = true;
            lidText.innerText = "Đang tính toán...";

            // Đợi 0.5s cho người chơi cảm giác chờ đợi rồi chốt kết quả ngầm
            setTimeout(() => {
                
                if (remoteForcedValue && remoteForcedValue !== 'none') {
                    if (remoteForcedValue === 'tai') currentDice = generateDiceInRange(11, 18);
                    else if (remoteForcedValue === 'xiu') currentDice = generateDiceInRange(3, 10);
                    else currentDice = generateDiceInRange(remoteForcedValue, remoteForcedValue);
                    remoteForcedValue = null; 
                } else {
                    let currentMode = sessionPool.pop();
                    if (sessionPool.length === 0) initSessionPool(); 

                    if (currentMode === 'bias') {
                        let last5 = allHistory.slice(-5);
                        let taiCount = last5.filter(x => x >= 11).length;
                        let xiuCount = last5.length - taiCount;
                        let forceTai;
                        if (taiCount > xiuCount) forceTai = false; 
                        else if (xiuCount > taiCount) forceTai = true; 
                        else forceTai = Math.random() < 0.5;
                        
                        if (forceTai) currentDice = generateDiceInRange(11, 18);
                        else currentDice = generateDiceInRange(3, 10);
                    } else {
                        currentDice = [getRandomDiceValue(), getRandomDiceValue(), getRandomDiceValue()];
                    }
                }

                isRolling = false;
                rollBtn.disabled = false;
                lidText.innerText = "Kéo Ra Khỏi Đĩa Để Mở";
            }, 500); 
        }

        // --- MỞ NẮP ---
        function openLidFinal(dx, dy) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            const nx = dist === 0 ? 0 : dx / dist;
            const ny = dist === 0 ? -1 : dy / dist;
            
            lid.style.transition = 'transform 0.4s ease-in, opacity 0.4s';
            lid.style.transform = `translate(${nx * 500}px, ${ny * 500}px) scale(0.5) rotate(90deg)`;
            lid.style.opacity = '0';
            
            setTimeout(() => {
                lid.classList.remove('closed');
                lid.classList.add('open');
                
                renderDiceFromArray(currentDice);
                
                let total = currentDice.reduce((a, b) => a + b, 0);
                updateHistory(total);
            }, 400);
        }

        // --- XỬ LÝ KÉO NẮP ---
        let startX = 0, startY = 0, currentX = 0, currentY = 0;
        let isDragging = false, isPointerDown = false;

        lid.addEventListener('pointerdown', (e) => {
            if (isRolling || !lid.classList.contains('closed')) return;
            isPointerDown = true;
            startX = e.clientX;
            startY = e.clientY;
            currentX = 0; currentY = 0; isDragging = false;
            lid.style.transition = 'none'; 
            lid.setPointerCapture(e.pointerId);
        });

        lid.addEventListener('pointermove', (e) => {
            if (!isPointerDown || isRolling || !lid.classList.contains('closed')) return;
            
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            const dist = Math.sqrt(currentX * currentX + currentY * currentY);
            
            if (dist > 10) { // Bắt đầu tính là kéo khi di chuyển > 10px
                isDragging = true;
                lid.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        });

        lid.addEventListener('pointerup', (e) => {
            if (!isPointerDown) return; 
            isPointerDown = false; 
            
            if (isRolling || !lid.classList.contains('closed')) return;
            
            const dist = Math.sqrt(currentX * currentX + currentY * currentY);
            lid.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
            
            if (isDragging) {
                if (dist > 50) { // Kéo ra xa > 50px thì mở nắp
                    openLidFinal(currentX, currentY);
                } else { // Kéo chưa đủ xa thì trả nắp về
                    lid.style.transform = 'translate(0, 0)';
                }
            } else {
                // Nếu chỉ click nhẹ (không kéo) thì nắp đứng yên
                lid.style.transform = 'translate(0, 0)';
            }
            isDragging = false;
        });

        lid.addEventListener('pointercancel', () => {
            isPointerDown = false;
            if (isDragging) {
                lid.style.transition = 'transform 0.3s ease-out';
                lid.style.transform = 'translate(0, 0)';
                isDragging = false;
            }
        });

        // Khởi tạo
        rollBtn.addEventListener('click', startNewRound);
        startNewRound();
    </script>
</body>
</html>
